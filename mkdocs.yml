site_name: Chad Rodgers - Pages
site_url: https://chaddrodgers.github.io/pages/
repo_url: https://github.com/ChadDRodgers/pages

theme:
  name: material

  features:
    - navigation.tabs
    - navigation.tabs.sticky

  palette: 
    # Palette toggle for light mode
    - scheme: default
      primary: green
      accent: indigo
      toggle:
        icon: material/weather-sunny # Sun icon
        name: Switch to dark mode
    
    # Palette toggle for dark mode
    - scheme: slate
      primary: green
      accent: indigo
      toggle:
        icon: material/weather-night # Moon icon
        name: Switch to light mode

  custom_dir: overrides  # Point here if you need to override HTML templates

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/extra.js

nav:
  - Home: index.md
  - Articles:
      - My Ideas: articles/ideas.md
  - Tutorials:
      - Creating Pi Image: tutorials/creating_pi_image.md
      - CoachProxy — Reflash & Tailscale: tutorials/reflash_coachproxy_add_tailscale.md
      - Shutdown CoachProxy: tutorials/shutdown_coachproxy.md
      - Node-RED: tutorials/node-red.md
      - AWS Email Service: tutorials/aws_email_setup.md
      - AWS SES Redirect: tutorials/aws_ses_setup.md
      
  - About Me: about.md
